name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Baza testowa żyje tylko na czas joba; hasło dotyczy tego jednorazowego kontenera, to nie sekret
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roombooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d roombooking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/roombooking_test

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Docker image
        run: docker build -t room-booking-api .
