services:
  db:
    image: postgres:17
    container_name: roombooking04-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - roombooking04-pgdata:/var/lib/postgresql/data

volumes:
  roombooking04-pgdata:
